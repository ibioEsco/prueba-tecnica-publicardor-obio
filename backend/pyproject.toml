[project]
name = "linkedin-cobol-engine"
version = "0.1.0"
description = "Autonomous content engine for LinkedIn COBOL/mainframe posts"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "google-genai>=1.0.0",
    "python-multipart==0.0.12",
    "aiohttp>=3.11.0",
    "Pillow==10.4.0",
    "python-dotenv==1.0.1",
    "pydantic==2.9.2",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "supabase>=2.16.0",
]

[dependency-groups]
dev = []
